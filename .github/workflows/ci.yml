name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch rather than letting them pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # Built on its own because it has no front-end dependency, so a Node problem
      # cannot mask a C# one.
      - name: Build Wistellar.Core
        run: dotnet build Wistellar.Core/Wistellar.Core.csproj -c Release --warnaserror

  frontend:
    name: Build front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: Wistellar.Frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: Wistellar.Frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: Wistellar.Frontend
        run: pnpm run check

      - name: Build
        working-directory: Wistellar.Frontend
        run: pnpm run build

  server:
    name: Build server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Building the server also builds the front end through the .esproj wrapper.
      # The container image is built and published by docker-publish.yml.
      - name: Build Wistellar.Server
        run: dotnet build Wistellar.Server/Wistellar.Server.csproj -c Release --warnaserror
